<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>depth-vfx</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; touch-action: none; }
    canvas { position: fixed; top: 0; left: 0; z-index: 1; }

    #launch {
      position: fixed; inset: 0; z-index: 30;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    }
    #launch.hidden { display: none; }
    #launch-label {
      font-family: ui-monospace, 'SF Mono', Menlo, monospace;
      font-size: 10px; letter-spacing: 0.25em; color: rgba(255,255,255,0.25); text-transform: uppercase;
    }
    #launch-btn {
      font-family: ui-monospace, 'SF Mono', Menlo, monospace;
      font-size: 12px; letter-spacing: 0.2em; color: #fff;
      background: none; border: 1px solid rgba(255,255,255,0.25);
      padding: 12px 28px; cursor: pointer; border-radius: 2px;
      -webkit-tap-highlight-color: transparent;
    }
    #launch-btn:active { opacity: 0.45; }
    #launch-err {
      font-family: ui-monospace, 'SF Mono', Menlo, monospace;
      font-size: 10px; color: rgba(255,70,70,0.8);
      display: none; text-align: center; max-width: 260px; line-height: 1.5;
    }

    #panel {
      position: fixed; bottom: 0; left: 50%;
      transform: translateX(-50%) translateY(calc(100% - 36px));
      transition: transform 0.38s cubic-bezier(0.4, 0, 0.2, 1);
      width: min(360px, 92vw);
      background: rgba(6, 6, 10, 0.75);
      -webkit-backdrop-filter: blur(28px) saturate(160%);
      backdrop-filter: blur(28px) saturate(160%);
      border: 1px solid rgba(255,255,255,0.07); border-bottom: none;
      border-radius: 16px 16px 0 0; z-index: 20;
      padding: 0 22px 44px; display: none;
    }
    #panel.open { transform: translateX(-50%) translateY(0); }
    #panel-handle {
      height: 36px; display: flex; align-items: center; justify-content: center;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    #panel-handle::before {
      content: ''; width: 28px; height: 3px; border-radius: 2px;
      background: rgba(255,255,255,0.18);
    }
    .ctrl-row { display: flex; align-items: center; gap: 10px; margin-bottom: 13px; }
    .ctrl-row:last-child { margin-bottom: 0; }
    .ctrl-label {
      font-family: ui-monospace, 'SF Mono', Menlo, monospace;
      font-size: 9px; letter-spacing: 0.18em; color: rgba(255,255,255,0.35);
      text-transform: uppercase; width: 52px; flex-shrink: 0;
    }
    .ctrl-val {
      font-family: ui-monospace, 'SF Mono', Menlo, monospace;
      font-size: 9px; color: rgba(255,255,255,0.2); width: 24px; text-align: right; flex-shrink: 0;
    }
    input[type=range] {
      flex: 1; -webkit-appearance: none; appearance: none;
      height: 2px; background: rgba(255,255,255,0.1); border-radius: 1px; outline: none; cursor: pointer;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%;
      background: #fff; cursor: pointer; box-shadow: 0 0 0 1px rgba(255,255,255,0.15);
    }
    .ctrl-divider { height: 1px; background: rgba(255,255,255,0.05); margin: 14px 0; }
  </style>
</head>
<body>
  <video id="cam" autoplay playsinline muted></video>

  <div id="launch">
    <p id="launch-label">depth-vfx v1</p>
    <button id="launch-btn">ACTIVATE CAMERA</button>
    <p id="launch-err"></p>
  </div>

  <div id="panel">
    <div id="panel-handle"></div>
    <div class="ctrl-row">
      <span class="ctrl-label">BLOOM</span>
      <input type="range" id="s-bloom" min="0" max="100" value="55">
      <span class="ctrl-val" id="v-bloom">0.8</span>
    </div>
    <div class="ctrl-row">
      <span class="ctrl-label">CLOUD</span>
      <input type="range" id="s-cloud" min="0" max="100" value="70">
      <span class="ctrl-val" id="v-cloud">0.7</span>
    </div>
    <div class="ctrl-row">
      <span class="ctrl-label">DEPTH</span>
      <input type="range" id="s-depth" min="0" max="100" value="50">
      <span class="ctrl-val" id="v-depth">1.5</span>
    </div>
    <div class="ctrl-row">
      <span class="ctrl-label">VIEW</span>
      <input type="range" id="s-view" min="0" max="100" value="0">
      <span class="ctrl-val" id="v-view">0.0</span>
    </div>
    <div class="ctrl-row">
      <span class="ctrl-label">ROTATE</span>
      <input type="range" id="s-rotate" min="0" max="100" value="50">
      <span class="ctrl-val" id="v-rotate">0.0</span>
    </div>
    <div class="ctrl-row">
      <span class="ctrl-label">LINES</span>
      <input type="range" id="s-lines" min="0" max="100" value="60">
      <span class="ctrl-val" id="v-lines">0.6</span>
    </div>
    <div class="ctrl-row">
      <span class="ctrl-label">SCALE</span>
      <input type="range" id="s-scale" min="0" max="100" value="100">
      <span class="ctrl-val" id="v-scale">1.0</span>
    </div>
    <div class="ctrl-divider"></div>
    <div class="ctrl-row">
      <span class="ctrl-label">SEGMENT</span>
      <input type="range" id="s-segment" min="0" max="100" value="0">
      <span class="ctrl-val" id="v-segment">0</span>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }      from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass }      from 'three/addons/postprocessing/ShaderPass.js';

// ── renderer ─────────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.autoClear = false;
document.body.appendChild(renderer.domElement);

// ── cameras ───────────────────────────────────────────────────────────────────
// Perspective for VFX — fov chosen so world ±1 = screen edge in Y at z=0
// tan(fov/2) = 1/3  →  fov ≈ 36.87°
const FOV_DEG  = 2 * Math.atan(1 / 3) * (180 / Math.PI);
let   AR       = innerWidth / innerHeight;
const perspCam = new THREE.PerspectiveCamera(FOV_DEG, AR, 0.01, 20);
perspCam.position.z = 3;

// ── scenes ────────────────────────────────────────────────────────────────────
const vfxScene = new THREE.Scene();

// ── controls ──────────────────────────────────────────────────────────────────
const ctrl = { bloom: 0.8, depth: 1.5, cloud: 0.7, view: 0, scale: 1.0, segment: 0, lines: 0.6, rotate: 0 };


// ── pixel sampler ─────────────────────────────────────────────────────────────

// ── silhouette segmentation texture ──────────────────────────────────────────
// 80-column 1-row float texture: each texel = UV-Y of first dark pixel in that column
const SIL_COLS = 80, SIL_ROWS = 80;
const silData = new Float32Array(SIL_COLS);
const silTex  = new THREE.DataTexture(silData, SIL_COLS, 1, THREE.RedFormat, THREE.FloatType);
silTex.magFilter = THREE.LinearFilter;
silTex.minFilter = THREE.LinearFilter;

// ── shared video texture + uniforms ───────────────────────────────────────────
const pcUniforms = {
  videoTex:      { value: new THREE.Texture() },
  vidAR:         { value: 1 },
  scrAR:         { value: AR },
  worldAR:       { value: AR },
  zScale:        { value: ctrl.depth },
  cloudOpacity:  { value: ctrl.cloud },
  silhouetteTex: { value: silTex },
};

function initBg(videoEl) {
  const vt = new THREE.VideoTexture(videoEl);
  vt.minFilter = THREE.LinearFilter;
  vt.magFilter = THREE.LinearFilter;
  pcUniforms.videoTex.value = vt;
}

const silCanvas = Object.assign(document.createElement('canvas'), { width: SIL_COLS, height: SIL_ROWS });
const silCtx    = silCanvas.getContext('2d', { willReadFrequently: true });

function scanSilhouette() {
  if (!camEl.videoWidth) return;
  silCtx.drawImage(camEl, 0, 0, SIL_COLS, SIL_ROWS);
  const px     = silCtx.getImageData(0, 0, SIL_COLS, SIL_ROWS).data;
  const thresh = ctrl.segment;
  for (let col = 0; col < SIL_COLS; col++) {
    silData[col] = 0;
    if (thresh < 1) continue; // disabled — leave 0 so shader falls back to full depth
    for (let row = 0; row < SIL_ROWS; row++) {
      const i    = (row * SIL_COLS + col) << 2;
      const luma = (px[i] * 299 + px[i+1] * 587 + px[i+2] * 114) / 1000;
      if (luma < thresh) {
        silData[col] = 1.0 - row / (SIL_ROWS - 1); // uv.y: 0=bottom, 1=top
        break;
      }
    }
  }
  silTex.needsUpdate = true;
}

// ── point cloud ───────────────────────────────────────────────────────────────
// Grid stored as UV coords in XY (0..1); vertex shader computes world pos + Z from luma
const PC_COLS = 160, PC_ROWS = 120;
const pcCount = PC_COLS * PC_ROWS;
const pcPosArr = new Float32Array(pcCount * 3);
for (let row = 0; row < PC_ROWS; row++) {
  for (let col = 0; col < PC_COLS; col++) {
    const idx = row * PC_COLS + col;
    pcPosArr[idx * 3]     = col / (PC_COLS - 1); // U
    pcPosArr[idx * 3 + 1] = row / (PC_ROWS - 1); // V
    pcPosArr[idx * 3 + 2] = 0;
  }
}
const pcGeo = new THREE.BufferGeometry();
pcGeo.setAttribute('position', new THREE.BufferAttribute(pcPosArr, 3));

// Step sizes for Sobel kernel (in UV space, one grid cell)
pcUniforms.stepU = { value: 1.0 / (PC_COLS - 1) };
pcUniforms.stepV = { value: 1.0 / (PC_ROWS - 1) };

const pcMat = new THREE.ShaderMaterial({
  uniforms: pcUniforms,
  blending: THREE.AdditiveBlending,
  transparent: true,
  depthWrite: false,
  vertexShader: `
    uniform sampler2D videoTex;
    uniform sampler2D silhouetteTex;
    uniform float vidAR, scrAR, worldAR, zScale, stepU, stepV;
    varying float vDepth;
    varying float vEdge;
    varying vec2 vCorrUv;
    varying float vBodyMask;

    // Sample video luma at UV with cover-fit correction
    float sampleL(vec2 uv) {
      vec2 s = uv;
      float r = vidAR / scrAR;
      if (r > 1.0) s.x = (s.x - 0.5) / r + 0.5;
      else         s.y = (s.y - 0.5) * r + 0.5;
      s = clamp(s, 0.001, 0.999);
      vec3 c = texture2D(videoTex, s).rgb;
      return 0.299 * c.r + 0.587 * c.g + 0.114 * c.b;
    }

    void main() {
      vec2 uv = position.xy; // grid UV stored in XY

      // Cover-fit corrected UV — passed to fragment for camera color sampling
      vec2 corrUv = uv;
      float ar = vidAR / scrAR;
      if (ar > 1.0) corrUv.x = (corrUv.x - 0.5) / ar + 0.5;
      else          corrUv.y = (corrUv.y - 0.5) * ar + 0.5;
      vCorrUv = clamp(corrUv, 0.001, 0.999);

      float luma = sampleL(uv);

      // Sobel edge detection over one grid-cell neighbourhood
      float tl = sampleL(uv + vec2(-stepU,-stepV));
      float tc = sampleL(uv + vec2( 0.   ,-stepV));
      float tr = sampleL(uv + vec2( stepU,-stepV));
      float ml = sampleL(uv + vec2(-stepU, 0.   ));
      float mr = sampleL(uv + vec2( stepU, 0.   ));
      float bl = sampleL(uv + vec2(-stepU, stepV));
      float bc = sampleL(uv + vec2( 0.   , stepV));
      float br = sampleL(uv + vec2( stepU, stepV));
      float gx = -tl - 2.*ml - bl + tr + 2.*mr + br;
      float gy = -tl - 2.*tc - tr + bl + 2.*bc + br;
      float edge = clamp(sqrt(gx*gx + gy*gy) * 4.0, 0.0, 1.0);

      // Fake body segmentation — column scan silhouette
      // silY = UV-Y of first dark pixel in this column (0 = none detected)
      float silY     = texture2D(silhouetteTex, vec2(uv.x, 0.5)).r;
      // bodyMask=1 inside body region; when silY=0 (disabled) fall back to full mask
      float bodyMask = silY < 0.01 ? 1.0 : step(uv.y, silY);
      vBodyMask = bodyMask;

      float depth = (1.0 - luma) * mix(0.06, 1.0, bodyMask); // background nearly flat
      vDepth = depth;
      vEdge  = edge;

      // Reconstruct world position from UV + Z-displace by depth
      vec3 pos;
      pos.x = (uv.x * 2.0 - 1.0) * worldAR;
      pos.y = uv.y * 2.0 - 1.0;
      pos.z = depth * zScale;

      vec4 mvPos    = modelViewMatrix * vec4(pos, 1.0);
      gl_Position   = projectionMatrix * mvPos;
      float dist    = max(-mvPos.z, 0.1);
      gl_PointSize  = clamp((depth * 2.0 + edge * 1.5 + 0.3) * 120.0 / dist, 0.5, 5.0);
    }
  `,
  fragmentShader: `
    uniform sampler2D videoTex;
    uniform float cloudOpacity;
    varying float vDepth;
    varying float vEdge;
    varying vec2 vCorrUv;
    varying float vBodyMask;

    void main() {
      vec3 col = texture2D(videoTex, vCorrUv).rgb;
      float luma = 0.299*col.r + 0.587*col.g + 0.114*col.b;
      if (luma < 0.04) discard;

      vec2 c = gl_PointCoord * 2.0 - 1.0;
      float r = dot(c, c);
      if (r > 1.0) discard;
      float soft = 1.0 - smoothstep(0.2, 1.0, r);

      // Body: full brightness + edge glow  |  Background: dimmed, no glow
      float brightness = mix(0.25, 1.0, vBodyMask);
      vec3 finalCol    = col * brightness * (1.0 + vEdge * 1.4 * vBodyMask);
      gl_FragColor     = vec4(finalCol, soft * cloudOpacity);
    }
  `,
});

const pointCloud = new THREE.Points(pcGeo, pcMat);
pointCloud.frustumCulled = false;
vfxScene.add(pointCloud);

// ── speed lines ───────────────────────────────────────────────────────────────
const N_LINES    = 90;
const slPosArr   = new Float32Array(N_LINES * 6); // tail + head, 3 floats each
const slColArr   = new Float32Array(N_LINES * 6);
const slGeo      = new THREE.BufferGeometry();
const slPosAttr  = new THREE.BufferAttribute(slPosArr, 3);
const slColAttr  = new THREE.BufferAttribute(slColArr, 3);
slGeo.setAttribute('position', slPosAttr);
slGeo.setAttribute('color',    slColAttr);

const slMat = new THREE.LineBasicMaterial({
  vertexColors: true, blending: THREE.AdditiveBlending,
  transparent: true, depthWrite: false,
});
const speedLines = new THREE.LineSegments(slGeo, slMat);
speedLines.frustumCulled = false;
speedLines.renderOrder = -1; // drawn before point cloud
vfxScene.add(speedLines);

function mkLine() {
  return {
    x:   -AR * 1.4,                               // spawn off left edge
    y:   (Math.random() - 0.5) * 2.6,
    z:   -0.9 + Math.random() * 3.4,              // spread in depth: behind → in front of body
    len: 0.015 + Math.pow(Math.random(), 1.3) * 0.9, // bias toward short
    spd: 0.006 + Math.random() * 0.038,
    br:  0.3 + Math.random() * 0.7,               // per-line brightness
  };
}
const slData = Array.from({ length: N_LINES }, () => {
  const d = mkLine();
  d.x = (Math.random() * 2 - 1) * AR * 1.4; // scatter across width on boot
  return d;
});

// ── gyroscope parallax ────────────────────────────────────────────────────────
const gyro = { tx: 0, ty: 0, baseB: null, baseG: null };

function startGyro() {
  function onOri(e) {
    if (gyro.baseB === null) { gyro.baseB = e.beta; gyro.baseG = e.gamma; }
    gyro.tx = ((e.gamma - gyro.baseG) * Math.PI / 180) * 0.22;
    gyro.ty = ((e.beta  - gyro.baseB) * Math.PI / 180) * 0.16;
  }
  if (typeof DeviceOrientationEvent !== 'undefined' &&
      typeof DeviceOrientationEvent.requestPermission === 'function') {
    DeviceOrientationEvent.requestPermission()
      .then(p => { if (p === 'granted') window.addEventListener('deviceorientation', onOri); })
      .catch(() => {});
  } else {
    window.addEventListener('deviceorientation', onOri);
  }
}

// ── post-processing ───────────────────────────────────────────────────────────
const composer = new EffectComposer(renderer);

const vfxPass = new RenderPass(vfxScene, perspCam);
vfxPass.clearColor = new THREE.Color(0, 0, 0); vfxPass.clearAlpha = 1;
composer.addPass(vfxPass);

const bloomPass = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), ctrl.bloom, 0.65, 0.40);
composer.addPass(bloomPass);

composer.addPass(new ShaderPass({
  uniforms: { tDiffuse: { value: null } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse; varying vec2 vUv;
    void main(){
      vec3 c = texture2D(tDiffuse, vUv).rgb;
      c.r *= 0.92; c.b = min(c.b * 1.14 + 0.03, 1.0);
      vec2 d = vUv - 0.5; c *= max(1.0 - dot(d,d) * 1.15, 0.0);
      gl_FragColor = vec4(c, 1.0);
    }`,
}));

// ── resize ────────────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  AR = innerWidth / innerHeight;
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  perspCam.aspect = AR; perspCam.updateProjectionMatrix();
  pcUniforms.scrAR.value   = AR;
  pcUniforms.worldAR.value = AR;
});

// ── update loop ───────────────────────────────────────────────────────────────
const lerp = (a, b, t) => a + (b - a) * t;
let time = 0, frameN = 0, active = false;
const camEl = document.getElementById('cam');

function update(dt) {
  time   += dt;
  frameN += 1;

  bloomPass.strength            = ctrl.bloom;
  pcUniforms.zScale.value       = ctrl.depth;
  pcUniforms.cloudOpacity.value = ctrl.cloud;

  if (frameN % 3 === 0 && camEl.videoWidth) {
    pcUniforms.vidAR.value = camEl.videoWidth / camEl.videoHeight;
    scanSilhouette();
  }

  pointCloud.scale.setScalar(ctrl.scale);

  // Speed lines — tail vertex black→head vertex blue-white (comet fade via additive blend)
  for (let i = 0; i < N_LINES; i++) {
    const ln = slData[i];
    ln.x += ln.spd;
    if (ln.x > AR * 1.4) Object.assign(ln, mkLine());

    const br = ln.br * ctrl.lines;
    // tail (dark → invisible with additive)
    slPosArr[i*6+0] = ln.x;       slPosArr[i*6+1] = ln.y; slPosArr[i*6+2] = ln.z;
    slColArr[i*6+0] = 0;           slColArr[i*6+1] = 0;     slColArr[i*6+2] = 0;
    // head (bright blue-white)
    slPosArr[i*6+3] = ln.x+ln.len; slPosArr[i*6+4] = ln.y; slPosArr[i*6+5] = ln.z;
    slColArr[i*6+3] = br * 0.65;   slColArr[i*6+4] = br * 0.82; slColArr[i*6+5] = br;
  }
  slPosAttr.needsUpdate = true;
  slColAttr.needsUpdate = true;

  // Spherical orbit around the subject:
  //   VIEW   → theta (0 = front, 1 = top-down)
  //   ROTATE → phi   (-1 = left profile, +1 = right profile)
  const theta = ctrl.view   * Math.PI * 0.5;   //  0 .. π/2
  const phi   = ctrl.rotate * Math.PI * 0.5;   // -π/2 .. π/2
  const R     = 3;
  const tgtX  = R * Math.cos(theta) * Math.sin(phi);
  const tgtY  = R * Math.sin(theta);
  const tgtZ  = R * Math.cos(theta) * Math.cos(phi);
  perspCam.position.x = lerp(perspCam.position.x, tgtX, 0.06);
  perspCam.position.y = lerp(perspCam.position.y, tgtY, 0.06);
  perspCam.position.z = lerp(perspCam.position.z, tgtZ, 0.06);
  perspCam.lookAt(0, 0, 0.4);          // aim at the body's depth midpoint
  perspCam.rotateY(gyro.tx);           // gyro parallax as a small overlay
  perspCam.rotateX(-gyro.ty);
}

let prevT = performance.now();
function tick() {
  requestAnimationFrame(tick);
  if (!active) return;
  const now = performance.now();
  update(Math.min((now - prevT) * 0.001, 0.05));
  prevT = now;
  renderer.clear();
  composer.render();
}

// ── slider wiring ─────────────────────────────────────────────────────────────
function wire(id, valId, min, max, dec, key) {
  const sl = document.getElementById(id);
  const vl = document.getElementById(valId);
  sl.addEventListener('input', () => {
    const v = min + (sl.value / 100) * (max - min);
    ctrl[key] = v;
    vl.textContent = dec === 0 ? Math.round(v) : v.toFixed(dec);
  });
}
wire('s-bloom',   'v-bloom',   0,   2,   1, 'bloom');
wire('s-cloud',   'v-cloud',   0,   1,   1, 'cloud');
wire('s-depth',   'v-depth',   0,   3,   1, 'depth');
wire('s-view',    'v-view',    0,   1,   1, 'view');
wire('s-rotate',  'v-rotate', -1,   1,   1, 'rotate');
wire('s-lines',   'v-lines',   0,   1,   1, 'lines');
wire('s-scale',   'v-scale',   0.2, 1,   1, 'scale');
wire('s-segment', 'v-segment', 0, 200,   0, 'segment');

// ── panel toggle ──────────────────────────────────────────────────────────────
const panel = document.getElementById('panel');
document.getElementById('panel-handle').addEventListener('click', () => panel.classList.toggle('open'));

// ── camera activation ─────────────────────────────────────────────────────────
document.getElementById('launch-btn').addEventListener('click', async () => {
  const errEl = document.getElementById('launch-err');
  errEl.style.display = 'none';
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false,
    });
    camEl.srcObject = stream;
    await camEl.play();
    initBg(camEl);
    startGyro();
    active = true;
    prevT  = performance.now();
    document.getElementById('launch').classList.add('hidden');
    panel.style.display = 'block';
  } catch (e) {
    errEl.textContent   = e.message || 'camera unavailable';
    errEl.style.display = 'block';
  }
});

tick();
  </script>
</body>
</html>
